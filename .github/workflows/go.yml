name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Verify go mod tidy
      run: |
        go mod tidy
        git diff --exit-code go.mod go.sum

    - name: Build local binaries
      run: |
        go build -v ./cmd/ax
        go build -v ./cmd/ax-controller
        go build -v ./cmd/ax-server
        go build -v ./cmd/ax-task-runner

    - name: Test
      run: go test -v ./...
